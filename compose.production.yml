name: redex
services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: artex
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_DB: artex
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U artex -d artex"]
      interval: 5s
      timeout: 3s
      retries: 20
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

  redex:
    image: redex-global:ecf9d34
    build:
      context: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      REDEX_PG_DSN: postgres://artex:${POSTGRES_PASSWORD}@postgres:5432/artex?sslmode=disable
      REDEX_SETUP_TOKEN: ${REDEX_SETUP_TOKEN:?Set REDEX_SETUP_TOKEN in .env}
      REDEX_LANG: ko
      REDEX_MODE: offensive
      REDEX_POLICY_FILE: /app/config/policy.json
    command: ["-addr", ":8787", "-proxy", "127.0.0.1:8788"]
    ports:
      - "127.0.0.1:8787:8787"
    volumes:
      - ./data:/app/data
      - ./skills:/app/skills
      - ./config:/app/config
      - ./.secrets/jwt.key:/app/jwt.key:ro
    healthcheck:
      test: ["CMD", "curl", "--fail", "--silent", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: 10m
        max-file: "3"

volumes:
  pgdata:
    external: true
    name: artex_pgdata
